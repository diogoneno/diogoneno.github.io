<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    :root {
        --primary: #00d4ff;
        --secondary: #0066ff;
        --dark: #0a0e27;
        --darker: #050816;
        --text: #e4e4e7;
        --text-secondary: #a1a1aa;
        --accent: #7c3aed;
        --success: #10b981;
        --warning: #f59e0b;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        background: var(--darker);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
    }

    .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
    }

    .animated-bg::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background:
            radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
            radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.1) 0%, transparent 50%);
        animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-50px, -50px); }
    }

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    nav {
        position: fixed;
        top: 0;
        width: 100%;
        padding: 1.5rem 5%;
        background: rgba(10, 14, 39, 0.9);
        backdrop-filter: blur(20px);
        z-index: 1000;
        border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    }

    nav .container {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .logo {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        gap: 2rem;
        list-style: none;
    }

    .nav-links a {
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        position: relative;
    }

    .nav-links a::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--primary);
        transition: width 0.3s ease;
    }

    .nav-links a:hover::after,
    .nav-links a.active::after {
        width: 100%;
    }

    .nav-links a:hover {
        color: var(--primary);
    }

    .mobile-menu-btn {
        display: none;
        background: none;
        border: none;
        color: var(--text);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0.5rem;
    }

    .btn {
        padding: 1rem 2.5rem;
        border-radius: 50px;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
        position: relative;
        overflow: hidden;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
    }

    .btn-secondary {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
        border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--primary);
    }

    .section-header {
        text-align: center;
        margin-bottom: 4rem;
    }

    .section-header h2 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 700;
        margin-bottom: 1rem;
    }

    .section-header p {
        color: var(--text-secondary);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
    }

    .divider {
        width: 60px;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        margin: 1rem auto;
        border-radius: 2px;
    }

    footer {
        padding: 3rem 5%;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
    }

    footer p {
        color: var(--text-secondary);
    }

    footer a {
        color: var(--primary);
        text-decoration: none;
    }

    @media (max-width: 768px) {
        .nav-links {
            display: none;
        }

        .mobile-menu-btn {
            display: block;
        }
    }

    /* ── Mobile navigation overlay ────────────────────────────────── */
    .mobile-overlay {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2000;
        background: rgba(5, 8, 22, 0.97);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .mobile-overlay.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
    }

    .mobile-overlay-close {
        position: absolute;
        top: 1.5rem;
        right: 1.5rem;
        background: none;
        border: none;
        color: var(--text);
        font-size: 2rem;
        cursor: pointer;
        padding: 0.5rem;
        line-height: 1;
    }

    .mobile-overlay-close:hover {
        color: var(--primary);
    }

    .mobile-overlay-links {
        list-style: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
        padding: 0;
        margin: 0;
    }

    .mobile-overlay-links a {
        color: var(--text);
        text-decoration: none;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        transition: color 0.2s ease;
    }

    .mobile-overlay-links a:hover {
        color: var(--primary);
    }

    .mobile-overlay-links a.active {
        color: var(--primary);
    }
</style>
